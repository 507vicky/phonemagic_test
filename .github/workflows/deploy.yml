name: Deploy Star Rail Wand to GitHub Pages

on:
  push:
    branches:
      - main # 如果你的主分支叫 master，請記得改成 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Supabase Credentials Safely
        env:
          # 將 GitHub Secrets 轉換為標準環境變數，避免字元衝突
          REAL_URL: ${{ secrets.SUPABASE_URL }}
          REAL_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 -c "
          import os
          
          # 讀取 index.html
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # 從環境變數安全地取代佔位符
          content = content.replace('{{SUPABASE_URL}}', os.environ['REAL_URL'])
          content = content.replace('{{SUPABASE_ANON_KEY}}', os.environ['REAL_KEY'])
          
          # 寫回 index.html
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          echo "✨ 透過 Python 安全注入 Supabase 金鑰完成，100% 避開字元衝突！"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
