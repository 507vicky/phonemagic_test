name: Deploy Star Rail Wand to GitHub Pages

on:
  push:
    branches:
      - main # 如果你的主分支叫 master，請記得改成 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # 💡 修正點 1：加回 GitHub Pages 強制要求的環境宣告
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Supabase Credentials Safely
        # 💡 修正點 2：在環境內部明確宣告環境變數，強迫它去抓取對應的 Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 檢查變數是不是空的，防止空包彈
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ 錯誤：GitHub Secrets 讀取不到值！"
            echo "請至專案 Settings -> Secrets and variables -> Actions"
            echo "檢查 Repository secrets 或 Environment secrets (github-pages) 內是否有正確填入。"
            exit 1
          fi
          
          # 使用 envsubst 精確替換變數，並寫回 index.html
          envsubst '$SUPABASE_URL,$SUPABASE_ANON_KEY' < index.html > index.tmp.html
          mv index.tmp.html index.html
          
          echo "✨ 星軌金鑰已透過 envsubst 安全注入成功！"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
