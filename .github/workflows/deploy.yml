name: Deploy Star Rail Wand to GitHub Pages

on:
  push:
    branches:
      - main # 如果你的主分支叫 master，請記得改成 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # 💡 關鍵修正：移除 environment: github-pages 宣告，避開 GitHub 變數層級隔離的死穴
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Supabase Credentials Safely
        # 💡 將 Secrets 綁定到環境變數中
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 檢查變數是不是空的，防止空包彈
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ 錯誤：GitHub Secrets 讀取不到值！請檢查 Repository Secrets 命名。"
            exit 1
          fi
          
          # 使用 envsubst 精確替換變數，並產生一個暫存檔，再寫回 index.html
          envsubst '$SUPABASE_URL,$SUPABASE_ANON_KEY' < index.html > index.tmp.html
          mv index.tmp.html index.html
          
          echo "✨ 星軌金鑰已透過 envsubst 安全注入成功！"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
