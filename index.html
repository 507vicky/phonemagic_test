<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星軌校準法杖 - 直覺版</title>
    <style>
        /* 重置與防誤觸設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background-color: #0a0a0a; /* 極簡深色背景 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden; 
            touch-action: none; 
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* 發光層：維持單純的單色光暈，避免過度花俏 */
        #light-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            transition: background 0.6s ease-out;
            z-index: 1;
        }

        /* 主介面容器 */
        #ui-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            transition: opacity 0.5s ease;
        }

        /* 狀態文字：極簡排版 */
        #status-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-align: center;
            height: 60px; /* 固定高度避免跳動 */
        }

        /* 巨大的中央指示圖示 (動畫用) */
        #center-icon {
            font-size: 5rem;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 玻璃質感啟動按鈕 */
        #magic-btn {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 2px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* 動畫：聆聽中的呼吸燈效 */
        .listening {
            animation: pulse 1.5s infinite;
            border-color: rgba(255, 255, 255, 0.8) !important;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 30px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* 動畫：暗示玩家揮動法杖 */
        .shaking-hint {
            animation: shakeIt 0.8s infinite;
        }

        @keyframes shakeIt {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(15deg) scale(1.1); }
            50% { transform: rotate(0deg) scale(1.1); }
            75% { transform: rotate(-15deg) scale(1.1); }
            100% { transform: rotate(0deg); }
        }

        /* --- 星座解鎖彈窗 (玻璃擬物化卡片) --- */
        #result-card {
            position: absolute;
            z-index: 50;
            width: 80%;
            max-width: 320px;
            padding: 40px 20px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translateY(50px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
        }

        #result-card.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .zodiac-title {
            font-size: 2rem;
            letter-spacing: 4px;
            margin-bottom: 15px;
            font-weight: 300;
        }

        .zodiac-element {
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .reset-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.3s;
        }
    </style>
</head>
<body>

    <div id="light-layer"></div>

    <div id="ui-container">
        <div id="center-icon">✨</div>
        <button id="magic-btn">啟動</button>
        <div id="status-text">觸碰以喚醒星軌</div>
    </div>

    <div id="result-card">
        <div class="zodiac-title" id="zodiac-name">雙子座</div>
        <div class="zodiac-element" id="zodiac-desc">風元素．星軌校準完成</div>
        <button class="reset-btn" onclick="resetMagic()">再次校準</button>
    </div>

    <script>
        let isSpellCharged = false;
        let currentElement = ''; 
        const shakeThreshold = 15;

        const btn = document.getElementById('magic-btn');
        const statusText = document.getElementById('status-text');
        const lightLayer = document.getElementById('light-layer');
        const centerIcon = document.getElementById('center-icon');
        const uiContainer = document.getElementById('ui-container');
        const resultCard = document.getElementById('result-card');

        // 定義元素與星座的對應 (根據你的企劃書)
        const elementZodiacs = {
            'fire': { name: '火元素', color: 'rgba(210, 50, 20, 0.9)', icon: '🔥', zodiacs: ['牡羊座', '獅子座', '射手座'] },
            'water': { name: '水元素', color: 'rgba(20, 100, 210, 0.9)', icon: '💧', zodiacs: ['巨蟹座', '天蠍座', '雙魚座'] },
            'wind': { name: '風元素', color: 'rgba(60, 180, 150, 0.9)', icon: '🌪️', zodiacs: ['雙子座', '天秤座', '水瓶座'] },
            'earth': { name: '土元素', color: 'rgba(150, 110, 60, 0.9)', icon: '🌍', zodiacs: ['金牛座', '處女座', '摩羯座'] }
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false;

            recognition.onstart = function() {
                // UI 變化：呼吸燈提示正在聽
                btn.classList.add('listening');
                btn.innerText = "聆聽";
                statusText.innerHTML = "請說出元素咒語<br>(如：火、水、風、土)";
                centerIcon.style.opacity = '0';
            };

            recognition.onresult = function(event) {
                btn.classList.remove('listening');
                const transcript = event.results[0][0].transcript;
                checkSpell(transcript);
            };

            recognition.onerror = function(event) {
                btn.classList.remove('listening');
                if (event.error === 'not-allowed') statusText.innerHTML = "⚠️ 請允許麥克風權限";
                else if (event.error === 'no-speech') statusText.innerHTML = "🔇 沒聽清楚，請再試一次";
                else statusText.innerHTML = `❌ 錯誤: ${event.error}`;
                btn.innerText = "重試";
            };
        }

        // 判斷咒語邏輯
        function checkSpell(text) {
            if (text.includes('火') || text.includes('獅子') || text.includes('射手')) activateElement('fire');
            else if (text.includes('水') || text.includes('巨蟹') || text.includes('雙魚')) activateElement('water');
            else if (text.includes('風') || text.includes('雙子') || text.includes('水瓶')) activateElement('wind');
            else if (text.includes('土') || text.includes('地') || text.includes('摩羯')) activateElement('earth');
            else {
                statusText.innerHTML = "星軌未對齊，請重試";
                btn.innerText = "啟動";
            }
        }

        // 充能成功，準備揮動
        function activateElement(elementKey) {
            isSpellCharged = true;
            currentElement = elementKey;
            let elData = elementZodiacs[elementKey];

            // 視覺強烈轉換
            lightLayer.style.background = elData.color;
            btn.style.opacity = '0'; // 隱藏按鈕，強迫視線集中在中央圖示
            btn.style.pointerEvents = 'none';
            
            // 顯示巨大圖示並加上「晃動動畫」
            centerIcon.innerText = elData.icon;
            centerIcon.style.opacity = '1';
            centerIcon.style.transform = 'scale(1)';
            centerIcon.classList.add('shaking-hint');
            
            statusText.innerHTML = `已連結 ${elData.name}<br>揮動法杖釋放魔法！`;
            
            if (navigator.vibrate) navigator.vibrate(100);
        }

        // 初始化陀螺儀
        function initMotionSensor() {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') window.addEventListener('devicemotion', handleMotion);
                    }).catch(console.error);
            } else {
                window.addEventListener('devicemotion', handleMotion);
            }
        }

        // 處理揮動
        function handleMotion(event) {
            let acc = event.accelerationIncludingGravity;
            if (!acc.x) return;
            let totalForce = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
            
            if (totalForce > shakeThreshold && isSpellCharged) {
                isSpellCharged = false; 
                releaseMagic();
            }
        }

        // 釋放魔法，跳出星座卡片
        function releaseMagic() {
            window.removeEventListener('devicemotion', handleMotion);
            
            // 全白閃光震動
            lightLayer.style.background = "rgba(255, 255, 255, 1)";
            if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]);
            
            // 隱藏原本介面
            uiContainer.style.opacity = '0';
            uiContainer.style.pointerEvents = 'none';
            centerIcon.classList.remove('shaking-hint');

            // 隨機抽取星座
            let elData = elementZodiacs[currentElement];
            let randomZodiac = elData.zodiacs[Math.floor(Math.random() * elData.zodiacs.length)];
            
            // 延遲一下顯示高級星座卡片
            setTimeout(() => {
                // 背景調回微亮的深色，突顯玻璃卡片
                lightLayer.style.background = "rgba(20, 20, 20, 0.9)";
                document.getElementById('zodiac-name').innerText = randomZodiac;
                document.getElementById('zodiac-desc').innerText = `${elData.name} · 星軌校準完成`;
                resultCard.classList.add('show');
            }, 800);
        }

        // 重新開始機制
        function resetMagic() {
            resultCard.classList.remove('show');
            uiContainer.style.opacity = '1';
            uiContainer.style.pointerEvents = 'auto';
            btn.style.opacity = '1';
            btn.style.pointerEvents = 'auto';
            btn.innerText = "啟動";
            centerIcon.style.opacity = '0';
            centerIcon.style.transform = 'scale(0.5)';
            statusText.innerHTML = "觸碰以喚醒星軌";
            lightLayer.style.background = "transparent";
            currentElement = '';
        }

        btn.addEventListener('click', () => {
            if (recognition) {
                initMotionSensor(); 
                recognition.start(); 
            }
        });
    </script>
</body>
</html>
