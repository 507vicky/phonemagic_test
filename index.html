<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星軌校準法杖 - 8字型手勢版</title>
    <style>
        /* --- 重置與防誤觸設定 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background-color: #0a0a0a; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden; 
            touch-action: none; 
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        #light-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            transition: background 0.6s ease-out;
            z-index: 1;
        }

        #ui-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            transition: opacity 0.5s ease;
        }

        #status-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-align: center;
            height: 60px; 
            line-height: 1.5;
        }

        #center-icon {
            font-size: 5rem;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #magic-btn {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 2px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .listening {
            animation: pulse 1.5s infinite;
            border-color: rgba(255, 255, 255, 0.8) !important;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 30px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* ✨ 全新動畫：暗示玩家畫 8 字型 (無限大符號) ✨ */
        .figure8-hint {
            animation: figure8 2s infinite ease-in-out;
        }

        @keyframes figure8 {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(35px, -15px) scale(1.1); }
            50% { transform: translate(0, 0) scale(1); }
            75% { transform: translate(-35px, -15px) scale(1.1); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* --- 星座解鎖卡片 --- */
        #result-card {
            position: absolute;
            z-index: 50;
            width: 80%;
            max-width: 320px;
            padding: 40px 20px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translateY(50px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
        }

        #result-card.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .zodiac-title { font-size: 2rem; letter-spacing: 4px; margin-bottom: 15px; font-weight: 300; }
        .zodiac-element { font-size: 1rem; color: rgba(255,255,255,0.7); letter-spacing: 2px; margin-bottom: 30px; }
        .reset-btn {
            background: rgba(255,255,255,0.2); border: none; padding: 12px 30px;
            border-radius: 30px; color: white; font-size: 1rem; letter-spacing: 2px;
            cursor: pointer; transition: background 0.3s;
        }
    </style>
</head>
<body>

    <div id="light-layer"></div>

    <div id="ui-container">
        <div id="center-icon">✨</div>
        <button id="magic-btn">啟動</button>
        <div id="status-text">觸碰以喚醒星軌</div>
    </div>

    <div id="result-card">
        <div class="zodiac-title" id="zodiac-name">雙子座</div>
        <div class="zodiac-element" id="zodiac-desc">風元素．星軌校準完成</div>
        <button class="reset-btn" onclick="resetMagic()">再次校準</button>
    </div>

    <script>
        let isSpellCharged = false;
        let currentElement = ''; 
        
        // --- ✨ 8字型動作偵測變數 ✨ ---
        let motionStep = 0;         // 記錄畫8字的進度 (需達到4次轉折)
        let lastMotionSign = 0;     // 記錄上一次加速度的方向 (正或負)
        let lastMotionTime = 0;     // 記錄時間，避免雜訊並處理超時
        const xThreshold = 4.5;     // X軸加速度門檻 (畫8字較為平緩，數值需降低)
        const motionTimeout = 2500; // 必須在 2.5 秒內畫完 8 字型

        const btn = document.getElementById('magic-btn');
        const statusText = document.getElementById('status-text');
        const lightLayer = document.getElementById('light-layer');
        const centerIcon = document.getElementById('center-icon');
        const uiContainer = document.getElementById('ui-container');
        const resultCard = document.getElementById('result-card');

        const elementZodiacs = {
            'fire': { name: '火元素', color: 'rgba(210, 50, 20, 0.9)', icon: '🔥', zodiacs: ['牡羊座', '獅子座', '射手座'] },
            'water': { name: '水元素', color: 'rgba(20, 100, 210, 0.9)', icon: '💧', zodiacs: ['巨蟹座', '天蠍座', '雙魚座'] },
            'wind': { name: '風元素', color: 'rgba(60, 180, 150, 0.9)', icon: '🌪️', zodiacs: ['雙子座', '天秤座', '水瓶座'] },
            'earth': { name: '土元素', color: 'rgba(150, 110, 60, 0.9)', icon: '🌍', zodiacs: ['金牛座', '處女座', '摩羯座'] }
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false;

            recognition.onstart = function() {
                btn.classList.add('listening');
                btn.innerText = "聆聽";
                statusText.innerHTML = "請說出元素咒語<br>(如：火、水、風、土)";
                centerIcon.style.opacity = '0';
                centerIcon.classList.remove('figure8-hint'); // 重置動畫
            };

            recognition.onresult = function(event) {
                btn.classList.remove('listening');
                const transcript = event.results[0][0].transcript;
                checkSpell(transcript);
            };

            recognition.onerror = function(event) {
                btn.classList.remove('listening');
                console.error("語音錯誤:", event.error);
                if (event.error === 'not-allowed') statusText.innerHTML = "⚠️ 權限被拒絕<br>請允許使用麥克風";
                else if (event.error === 'no-speech') statusText.innerHTML = "🔇 沒聽清楚<br>請靠近麥克風重試";
                else statusText.innerHTML = `❌ 系統錯誤: ${event.error}`;
                btn.innerText = "重試";
            };
        } else {
            statusText.innerHTML = "您的瀏覽器不支援語音功能";
        }

        function checkSpell(text) {
            if (text.includes('火') || text.includes('獅子') || text.includes('射手') || text.includes('牡羊')) activateElement('fire');
            else if (text.includes('水') || text.includes('巨蟹') || text.includes('雙魚') || text.includes('天蠍')) activateElement('water');
            else if (text.includes('風') || text.includes('雙子') || text.includes('水瓶') || text.includes('天秤')) activateElement('wind');
            else if (text.includes('土') || text.includes('地') || text.includes('摩羯') || text.includes('處女') || text.includes('金牛')) activateElement('earth');
            else {
                statusText.innerHTML = "星軌未對齊，請重試";
                btn.innerText = "啟動";
            }
        }

        function activateElement(elementKey) {
            isSpellCharged = true;
            currentElement = elementKey;
            
            // 重置動作辨識狀態
            motionStep = 0;
            lastMotionSign = 0;

            let elData = elementZodiacs[elementKey];

            lightLayer.style.background = elData.color;
            btn.style.opacity = '0'; 
            btn.style.pointerEvents = 'none';
            
            centerIcon.innerText = elData.icon;
            centerIcon.style.opacity = '1';
            centerIcon.style.transform = 'scale(1)';
            centerIcon.classList.add('figure8-hint'); // 加上 8 字型暗示動畫
            
            statusText.innerHTML = `已連結 ${elData.name}<br>請以法杖畫出「8」字型！`;
            
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function initMotionSensor() {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') window.addEventListener('devicemotion', handleMotion);
                    }).catch(console.error);
            } else {
                window.addEventListener('devicemotion', handleMotion);
            }
        }

        // --- ✨ 核心升級：8 字型動作判斷邏輯 ✨ ---
        function handleMotion(event) {
            if (!isSpellCharged) return; 

            // 抓取 X 軸的加速度 (過濾掉硬體可能為 null 的狀況)
            let accX = event.acceleration ? event.acceleration.x : null;
            if (accX === null && event.accelerationIncludingGravity) {
                accX = event.accelerationIncludingGravity.x;
            }
            if (accX === null) return;

            let now = Date.now();

            // 如果玩家畫太慢（超過設定秒數），則重新計算
            if (now - lastMotionTime > motionTimeout) {
                motionStep = 0;
                lastMotionSign = 0;
            }

            // 當 X 軸加速度大於門檻，表示玩家正在向左或向右揮動
            if (Math.abs(accX) > xThreshold) {
                let currentSign = Math.sign(accX); // 取方向：1 為右，-1 為左
                
                if (motionStep === 0) {
                    // 第一筆動作開始
                    motionStep = 1;
                    lastMotionSign = currentSign;
                    lastMotionTime = now;
                } else if (currentSign !== lastMotionSign && (now - lastMotionTime > 150)) {
                    // 方向改變，且間隔超過 0.15 秒（過濾手震產生的雜訊）
                    motionStep++;
                    lastMotionSign = currentSign;
                    lastMotionTime = now;

                    // 一個完整的 8 字型，大約會產生 4 次左右方向的反轉
                    if (motionStep >= 4) {
                        motionStep = 0;
                        lastMotionSign = 0;
                        releaseMagic(); // 條件達成，釋放魔法！
                    }
                }
            }
        }

        function releaseMagic() {
            window.removeEventListener('devicemotion', handleMotion);
            
            lightLayer.style.background = "rgba(255, 255, 255, 1)";
            if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]);
            
            uiContainer.style.opacity = '0';
            uiContainer.style.pointerEvents = 'none';
            centerIcon.classList.remove('figure8-hint');

            let elData = elementZodiacs[currentElement];
            let randomZodiac = elData.zodiacs[Math.floor(Math.random() * elData.zodiacs.length)];
            
            setTimeout(() => {
                lightLayer.style.background = "rgba(20, 20, 20, 0.9)";
                document.getElementById('zodiac-name').innerText = randomZodiac;
                document.getElementById('zodiac-desc').innerText = `${elData.name} · 星軌校準完成`;
                resultCard.classList.add('show');
            }, 800);
        }

        function resetMagic() {
            resultCard.classList.remove('show');
            uiContainer.style.opacity = '1';
            uiContainer.style.pointerEvents = 'auto';
            btn.style.opacity = '1';
            btn.style.pointerEvents = 'auto';
            btn.innerText = "啟動";
            centerIcon.style.opacity = '0';
            centerIcon.style.transform = 'scale(0.5)';
            statusText.innerHTML = "觸碰以喚醒星軌";
            lightLayer.style.background = "transparent";
            currentElement = '';
        }

        btn.addEventListener('click', () => {
            if (recognition) {
                initMotionSensor(); 
                recognition.start(); 
            }
        });
    </script>
</body>
</html>
